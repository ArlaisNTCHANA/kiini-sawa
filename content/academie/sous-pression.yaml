description: |
  Sous pression, nous ne choisissons plus vraiment : une petite voix intérieure prend les commandes. « Sois parfait. » « Fais plaisir. » « Dépêche-toi. » « Sois fort. » « Fais des efforts. » Ces cinq voix nous ont souvent aidés à grandir. Mais, laissées seules au volant, elles épuisent le corps, abîment nos relations et nous éloignent de ce que Dieu nous a confié.

  En huit séances courtes, vous allez reconnaître vos deux voix les plus fortes, comprendre d'où elles viennent, découvrir la force cachée derrière chacune, et recevoir la parole qui libère. Puis vous apprendrez ce qui découle naturellement de cette liberté : dire non, sans culpabilité et sans dureté, pour que votre oui ait enfin du poids.

