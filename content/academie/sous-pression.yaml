# Parcours vitrine de l'Académie : les cinq pressions intérieures (d'après les « drivers » de Taibi Kahler, analyse
# transactionnelle) et la liberté de dire non. Idée et tableau du fondateur (27/11/2026) ; premier jet à relire.
# Chargé en brouillon par : php bin/console app:academie:import content/academie/sous-pression.yaml
# Ensuite, tout se relit et se modifie dans le studio (Admin › Académie) ; ce fichier ne sert qu'au premier chargement.
