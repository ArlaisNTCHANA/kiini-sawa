security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Compte\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        mobile_api:
            pattern: ^/api/mobile
            stateless: true
            provider: app_user_provider
            custom_authenticator: App\Mobile\Security\MobileBearerAuthenticator
            entry_point: App\Mobile\Security\MobileBearerAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Compte\Security\LoginAuthenticator
            logout:
                path: app_logout
                # Déconnexion par formulaire POST avec jeton (un lien ou une image sur un autre site ne peut plus déconnecter l'utilisateur)
                enable_csrf: true
                csrf_token_id: logout_form
                # where to redirect after logout
                # target: app_any_route

            # 5 tentatives de connexion échouées par email/IP sur 15 minutes, puis blocage temporaire
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # by default, the feature is enabled by checking a checkbox in the
                # login form, uncomment the following line to always enable it.
                #always_remember_me: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Ordre important : la première règle qui correspond s'applique.
    # Toute nouvelle page publique doit être ajoutée ici.
    # Un compte connecté mais dont l'email n'est pas vérifié est en plus redirigé
    # vers /verification-email (voir App\\Compte\\Security\\VerifiedUserSubscriber).
    access_control:
        - { path: ^/api/mobile/v1/(connexion|jeton|deconnexion)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/mobile, roles: ROLE_USER }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/(sante|robots\.txt|sitemap\.xml)$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/inscription$, roles: PUBLIC_ACCESS }
        - { path: ^/verification-email, roles: PUBLIC_ACCESS } # écran affiché aussi après une inscription avec une adresse déjà utilisée (le contrôleur renvoie vers /login sinon)
        - { path: ^/mot-de-passe/, roles: PUBLIC_ACCESS }
        - { path: ^/(mentions-legales|confidentialite|cgu|cgv)$, roles: PUBLIC_ACCESS }
        - { path: ^/notifications/desabonnement/, roles: PUBLIC_ACCESS }
        - { path: ^/rejoindre/, roles: PUBLIC_ACCESS }
        - { path: ^/couple/rejoindre/, roles: PUBLIC_ACCESS }
        - { path: ^/methode, roles: PUBLIC_ACCESS }
        - { path: ^/(installer|hors-ligne|rapide|boussole)$, roles: PUBLIC_ACCESS }
        - { path: ^/boussole/resultat$, roles: PUBLIC_ACCESS } # envoi des réponses : enregistrées si connecté, sinon gardées en session jusqu'à l'inscription
        - { path: ^/(defis$|defi/), roles: PUBLIC_ACCESS }
        - { path: ^/i/, roles: PUBLIC_ACCESS }
        - { path: ^/resultat/, roles: PUBLIC_ACCESS }
        - { path: ^/avis/, roles: PUBLIC_ACCESS }
        - { path: ^/academie/images/, roles: PUBLIC_ACCESS } # illustrations des leçons (nom aléatoire), aussi pour l'application mobile
        - { path: ^/confirmer/, roles: PUBLIC_ACCESS }
        - { path: ^/redevabilite/, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
