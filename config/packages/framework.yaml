# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    # Derrière l'hébergeur (proxy, répartiteur de charge) : sans cela, HTTPS et l'adresse IP réelle
    # ne sont pas reconnus, et la protection CSRF par l'origine refuserait des formulaires légitimes.
    # TRUSTED_PROXIES : adresses du proxy, ou « REMOTE_ADDR » si l'hébergeur le recommande.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

# Production : sessions en base de données. Les fichiers locaux sont effacés à chaque déploiement
# (et ne sont pas partagés entre plusieurs instances) : sans cela, tout le monde serait déconnecté.
when@prod:
    framework:
        session:
            handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
            # Nettoyage des sessions expirées (environ 1 requête sur 100), souvent désactivé chez les hébergeurs.
            gc_probability: 1

    services:
        Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
            arguments:
                - '%env(DATABASE_URL)%'
                - { db_table: 'sessions', lock_mode: 1 }
